UC-1 Define and Run Build Targets:
  Build: go build ./cmd/targ/ (verified: builds clean)
  Install: go install ./cmd/targ@latest
  Exercise: targ status (runs the 'status' dev target)
  Observe: target executes, output displayed

UC-2 Build a Standalone CLI:
  Build: go build -o myapp . (in a main package using targ.Main())
  Install: go install or copy binary
  Exercise: ./myapp <command> --help
  Observe: help output with flags, positionals, examples

UC-3 Discover Help, Completion, and Source Info:
  Build: (same binary as UC-1 or UC-2)
  Exercise: targ --help; targ <cmd> --help; targ --completion bash
  Observe: formatted help with ANSI styling, valid bash completion script

UC-4 Scaffold, Sync, and Convert Targets:
  Build: (same targ binary)
  Exercise: targ --create hello "echo hello world"
  Observe: creates targs.go with string target, message confirms creation

UC-5 Run Targets in Parallel with Organized Output:
  Build: (same binary with parallel deps defined)
  Exercise: define .Deps(a, b, targ.DepModeParallel), run parent target
  Observe: each target's output prefixed with [target-name], aligned, summary at end

UC-6 Discover Targets Across the Directory Tree:
  Build: go build ./cmd/targ/ (same binary)
  Install: go install ./cmd/targ@latest
  Exercise: create ~/dev/targs.go with targ.Register(Hello), run targ hello from ~/repos/project/src/
  Observe: ancestor target discovered, compiled via isolated build, and executed
""" }

